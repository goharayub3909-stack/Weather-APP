name: Verify Pakistan agricultural guidance
on: workflow_dispatch
permissions:
  contents: read
  checks: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read official public agricultural sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify-pakistan-agri.py
