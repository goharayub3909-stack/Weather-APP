name: Discover authenticated station endpoints
on: workflow_dispatch
permissions:
  contents: read
  checks: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect endpoint paths without publishing credentials
        env:
          WEATHERWALAY_USERNAME: ${{ secrets.WEATHERWALAY_USERNAME }}
          WEATHERWALAY_PASSWORD: ${{ secrets.WEATHERWALAY_PASSWORD }}
        run: python3 scripts/inspect-stations.py > /tmp/station-report.txt
      - name: Record safe station schema in integration check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          text=Path('/tmp/station-report.txt').read_text()
          # Only endpoint paths and station schema produced by the sanitizer.
          result={'name':'Station schema discovery','head_sha':os.environ['GITHUB_SHA'],'status':'completed','conclusion':'success','output':{'title':'Authenticated station schema','summary':'```json\n'+text[-60000:]+'\n```'}}
          Path('/tmp/check.json').write_text(json.dumps(result))
          PYTHON
          gh api repos/${{ github.repository }}/check-runs --input /tmp/check.json
