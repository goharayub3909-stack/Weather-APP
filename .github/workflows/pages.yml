name: Deploy free GitHub Pages website
on:
  push:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - name: Refresh public PMD radar catalogs
        env:
          PREVIOUS_RADAR_URL: ${{ steps.pages.outputs.base_url }}/radar-data/catalog.json
        run: python3 scripts/sync-radar.py
      - name: Discover EUMETView natural-colour layers and acquisition times
        run: python3 scripts/sync-satellite.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
