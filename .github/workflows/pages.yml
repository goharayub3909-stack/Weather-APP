name: Deploy free GitHub Pages website
on:
  push:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    permissions:
      contents: write
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - name: Refresh public PMD radar catalogs
        env:
          PREVIOUS_RADAR_URL: ${{ steps.pages.outputs.base_url }}/radar-data/catalog.json
        run: python3 scripts/sync-radar.py
      - name: Discover EUMETView natural-colour layers and acquisition times
        run: python3 scripts/sync-satellite.py
      - name: Refresh free airport observations
        run: python3 scripts/sync-metar.py
      - name: Refresh the full WeatherWalay realtime record (all columns, time stamps, elevations; also writes stations.json)
        id: realtime
        continue-on-error: true
        env:
          WEATHERWALAY_USERNAME: ${{ secrets.WEATHERWALAY_USERNAME }}
          WEATHERWALAY_PASSWORD: ${{ secrets.WEATHERWALAY_PASSWORD }}
        run: node scripts/sync-realtime.mjs
      - name: Fallback only if the realtime sync failed - older WeatherWalay script
        if: steps.realtime.outcome == 'failure'
        env:
          WEATHERWALAY_USERNAME: ${{ secrets.WEATHERWALAY_USERNAME }}
          WEATHERWALAY_PASSWORD: ${{ secrets.WEATHERWALAY_PASSWORD }}
          PREVIOUS_STATIONS_URL: ${{ steps.pages.outputs.base_url }}/observation-data/stations.json
        run: python3 scripts/sync-stations.py
      - name: Preserve station observations for analysis
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/archive-stations.py
      - name: Compute shared seven-day ECMWF thunderstorm guidance
        env:
          PREVIOUS_STORMS_URL: ${{ steps.pages.outputs.base_url }}/storm-data/cities.json
        run: node scripts/sync-storms.mjs
      - name: Refresh ECMWF 0.1 degree (9 km) open data for the 3D terrain map
        run: |
          python3 -m pip install --quiet eccodes numpy
          python3 scripts/sync-terrain-weather-ecmwf.py || echo "0.1 degree grid unavailable: the map falls back to the 0.5 degree grid"
      - name: Refresh the 0.5 degree fallback grid for the 3D terrain map
        run: node scripts/sync-terrain-weather.mjs
      - name: Validate application and forecast data handling
        run: |
          npm test
          python3 -m unittest discover -s test -p '*_test.py'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
