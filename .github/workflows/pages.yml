name: Deploy free GitHub Pages website
on:
  push:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    permissions:
      contents: write
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - name: Refresh public PMD radar catalogs
        env:
          PREVIOUS_RADAR_URL: ${{ steps.pages.outputs.base_url }}/radar-data/catalog.json
        run: python3 scripts/sync-radar.py
      - name: Discover EUMETView natural-colour layers and acquisition times
        run: python3 scripts/sync-satellite.py
      - name: Refresh free airport observations
        run: python3 scripts/sync-metar.py
      - name: Refresh WeatherWalay observations securely
        env:
          WEATHERWALAY_USERNAME: ${{ secrets.WEATHERWALAY_USERNAME }}
          WEATHERWALAY_PASSWORD: ${{ secrets.WEATHERWALAY_PASSWORD }}
          PREVIOUS_STATIONS_URL: ${{ steps.pages.outputs.base_url }}/observation-data/stations.json
        run: python3 scripts/sync-stations.py
      - name: Preserve station observations for analysis
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/archive-stations.py
      - name: Refresh shared ECMWF forecast studio snapshot
        env:
          PREVIOUS_STUDIO_URL: ${{ steps.pages.outputs.base_url }}/studio-data/forecast.json
        run: python3 scripts/sync-studio.py
      - name: Refresh finer shared ECMWF rainfall display
        env:
          PREVIOUS_RAIN_URL: ${{ steps.pages.outputs.base_url }}/studio-data/rain.json
        run: python3 scripts/sync-studio-rain.py
      - name: Validate application and forecast data handling
        run: |
          npm test
          python3 -m unittest discover -s test -p '*_test.py'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
